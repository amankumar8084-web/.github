name: Backend Health Check

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes
  workflow_dispatch: # Manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check all backend endpoints
        run: |
          URLS=(
            "https://academia-connect-3.onrender.com/api/health"
            "https://creatorbridge.onrender.com"
          )

          FAILED=0

          for URL in "${URLS[@]}"; do
            echo "----------------------------------------"
            echo "Checking: $URL"

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")

            echo "HTTP Status: $STATUS"

            if [ "$STATUS" -eq 200 ]; then
              echo "Backend is healthy ✅"
            else
              echo "Backend is DOWN ❌"
              FAILED=1
            fi
          done

          echo "----------------------------------------"

          if [ "$FAILED" -eq 1 ]; then
            echo "One or more backend endpoints failed ❌"
            exit 1
          else
            echo "All backend endpoints are healthy ✅"
          fi

      - name: Log success
        if: success()
        run: echo "All health checks passed ✅"

      - name: Log failure
        if: failure()
        run: echo "One or more health checks failed ❌"
